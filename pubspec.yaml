name: veggiicart
description: "VeggiiCart — fresh grocery ordering app for businesses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.7.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  shimmer: ^3.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  carousel_slider: ^5.1.2
  geolocator: ^13.0.2
  file_picker: ^8.1.7
  flutter_avif: ^3.1.0

dependency_overrides:
  # pub.dev package omits prebuilt libflutter_avif.so; GitHub repo includes jniLibs.
  flutter_avif_android:
    git:
      url: https://github.com/yekeskin/flutter_avif.git
      path: flutter_avif_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/veggiicart_icon_mark.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/veggiicart_icon_mark.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/branding/veggiicart_logo_transparent.png
    - assets/branding/veggiicart_icon_mark.png
    - assets/lottie/
