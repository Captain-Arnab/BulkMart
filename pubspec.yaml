name: bulkmart
description: "BulkMart — B2B bulk-ordering grocery app for wholesalers and restaurants."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.7.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  shimmer: ^3.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#7B2FF7"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/lottie/
